<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "RG2014D"; src: url("../Fonts/RG2014D.ttf"); }
  @font-face { font-family: "RG2014EM"; src: url("../Fonts/RG2014EM.ttf"); }
  html, body { margin: 0; padding: 0; width: 1024px; height: 512px; overflow: hidden; background: transparent; }
  .panel { position: absolute; left: 0; top: 0; width: 1024px; height: 512px; background: #6b3f1d; border-radius: 26px; }
  .inner { position: absolute; left: 10px; right: 10px; top: 10px; bottom: 10px; border: 7px solid #fff; border-radius: 18px; }
  .line { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-family: "RG2014EM"; }
  .l1 { top: 60px; font-size: 104px; }
  .l2 { top: 190px; font-size: 104px; }
  .l3 { top: 350px; font-size: 64px; font-family: "RG2014D"; }
</style>
</head>
<body>
  <div class="panel"><div class="inner">
    <div class="line l1">Walden Pond</div>
    <div class="line l2">State Reservation</div>
    <div class="line l3">NEXT RIGHT &#8594;</div>
  </div></div>
</body>
</html>
