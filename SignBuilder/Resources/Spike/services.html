<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "RG2014D"; src: url("../Fonts/RG2014D.ttf"); }
  @font-face { font-family: "RG2014EM"; src: url("../Fonts/RG2014EM.ttf"); }
  html, body { margin: 0; padding: 0; width: 1024px; height: 512px; overflow: hidden; background: transparent; }
  .panel { position: absolute; left: 0; top: 0; width: 1024px; height: 512px; background: #1f4ea1; border-radius: 26px; }
  .inner { position: absolute; left: 10px; right: 10px; top: 10px; bottom: 10px; border: 7px solid #fff; border-radius: 18px; }
  .title { position: absolute; left: 0; right: 0; top: 30px; text-align: center; color: #fff; font-family: "RG2014EM"; font-size: 84px; }
  .row { position: absolute; left: 40px; right: 40px; top: 170px; height: 240px; display: flex; flex-direction: row; justify-content: space-between; }
  .logo { width: 290px; height: 240px; background: #fff; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .logo .big { font-family: "RG2014D"; font-size: 96px; color: #1f4ea1; }
  .logo .small { font-family: "RG2014D"; font-size: 44px; color: #c8102e; }
</style>
</head>
<body>
  <div class="panel"><div class="inner">
    <div class="title">GAS &#8226; FOOD &#8226; LODGING</div>
    <div class="row">
      <div class="logo"><div class="big">GAS</div><div class="small">24 HR</div></div>
      <div class="logo"><div class="big">FOOD</div><div class="small">DINER</div></div>
      <div class="logo"><div class="big">INN</div><div class="small">MOTEL</div></div>
    </div>
  </div></div>
</body>
</html>
