<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "RG2014D"; src: url("../Fonts/RG2014D.ttf"); }
  html, body { margin: 0; padding: 0; width: 1024px; height: 512px; overflow: hidden; background: transparent; }
  .panel { position: absolute; left: 0; top: 0; width: 1024px; height: 512px; background: #006b45; border-radius: 26px; }
  .inner { position: absolute; left: 10px; right: 10px; top: 10px; bottom: 10px; border: 7px solid #fff; border-radius: 18px; }
  .shield { position: absolute; top: 90px; width: 300px; height: 300px; }
  .shield img { position: absolute; left: 0; top: 0; width: 300px; height: 300px; }
  .num { position: absolute; left: 0; width: 300px; top: 80px; text-align: center; font-family: "RG2014D"; font-size: 150px; color: #000; }
  .state { position: absolute; left: 0; top: 0; width: 300px; height: 300px; border-radius: 150px; background: #fff; }
  .state-inner { position: absolute; left: 14px; top: 14px; width: 260px; height: 260px; border-radius: 130px; border: 6px solid #000; }
  .us { left: 90px; }
  .ma { left: 634px; }
  .to { position: absolute; left: 430px; top: 190px; font-family: "RG2014D"; font-size: 110px; color: #fff; }
</style>
</head>
<body>
  <div class="panel"><div class="inner">
    <div class="shield us"><img src="us_route.svg"><div class="num">1</div></div>
    <div class="to">TO</div>
    <div class="shield ma"><div class="state"><div class="state-inner"></div></div><div class="num">2</div></div>
  </div></div>
</body>
</html>
